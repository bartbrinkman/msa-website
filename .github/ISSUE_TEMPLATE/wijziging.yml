name: Wijziging aanvragen
description: Vraag Claude om iets op de website aan te passen.
title: "Wijziging: "
labels: [claude]
body:
  - type: markdown
    attributes:
      value: |
        Claude pakt dit verzoek automatisch op, voert de wijziging door en opent een pull request. De link verschijnt hieronder. Pas als die pull request is samengevoegd, staat de wijziging op de website.

        Wil je daarna nog iets veranderen, of stelt Claude een vraag? Reageer dan **in de pull request** (niet in dit issue) met **@claude** gevolgd door je antwoord of vraag. Een reactie in dit issue start een nieuwe, aparte pull request.
  - type: input
    id: pagina
    attributes:
      label: Welke pagina?
      description: De link naar de pagina of de naam ervan, bijvoorbeeld "Hoogovenbaan" of "agenda".
    validations:
      required: false
  - type: textarea
    id: wijziging
    attributes:
      label: Wat moet er veranderen?
      description: Beschrijf het zo concreet mogelijk. Plak nieuwe tekst er gewoon in.
    validations:
      required: true
