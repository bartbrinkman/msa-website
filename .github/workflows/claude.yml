name: Claude

# Lets Claude make changes to the site from GitHub: mention @claude in an issue
# or comment, or open an issue with the "claude" label (the "Wijziging
# aanvragen" template sets it). Claude works on its own claude/... branch and
# opens a pull request itself (gh pr create, with the app token the action
# provides); nothing reaches the live site until that PR is merged into main.
#
# Only people with write access to the repo can trigger it.
#
# Needs, once: the Claude GitHub app on this repo (https://github.com/apps/claude)
# and one of these repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (Pro/Max subscription)
#   ANTHROPIC_API_KEY        an API key from console.anthropic.com

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled, assigned]

# One run per issue/PR at a time; a second request waits for the first.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # An issue opened with the label fires both "opened" and "labeled"; the
    # label run handles it, so "opened" only counts when it is not labelled.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        !contains(github.event.issue.labels.*.name, 'claude') &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installed up front so Claude can run the tests and the build itself.
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Bash(npm test),Bash(npm run build),Bash(gh pr create:*),Bash(gh pr list:*)"
            --append-system-prompt "Je werkt aan de website van Modelspoorclub Alkmaar op verzoek van een clublid, meestal iemand zonder programmeerervaring. Antwoord in het Nederlands, in gewone taal. Volg de inhoudsregels in CLAUDE.md strikt. Is een verzoek onduidelijk, stel dan eerst een vraag in plaats van te gokken. Draai voor je klaar bent altijd npm test en npm run build en los fouten op. PULL REQUEST: dit gaat boven de standaardinstructie om een 'Create a PR'-link te geven. Heb je commits gepusht naar een nieuwe branch en bestaat er nog geen pull request voor die branch (controleer met gh pr list --head <branch>), open de pull request dan zelf met gh pr create --base main --head <branch> --title '<korte Nederlandse titel>' --body '<body>'. De body beschrijft in gewone taal wat er op welke pagina is veranderd en eindigt met 'Closes #<issuenummer>' als je vanuit een issue werkt. Zet geen 'Generated with Claude Code'-regel of andere AI-vermelding in de body. Zet in je reactie de link naar de geopende pull request in plaats van een 'Create a PR'-link. Werk je op een bestaande pull request, push dan alleen naar die branch. Leg in je laatste reactie kort uit wat er is veranderd, en dat het pas live gaat als de pull request is samengevoegd."
