name: Deploy to GitHub Pages

# GitHub Pages hosts main at /msa-website/ and a preview of every open pull
# request at /msa-website/pr/<number>/.
#
# Pages serves one site, so every deploy rebuilds the whole thing: main plus
# each open PR. A preview disappears with the next deploy after its PR closes.
#
# Previews are built here, triggered by the PR's Check run, rather than in the
# PR's own workflow: the github-pages environment only accepts deploys from
# main, and a workflow_run job runs on main.
#
# Security: building a PR runs that PR's code (package.json scripts, the Astro
# config, dependencies). So each PR is built in its own job that holds nothing:
# read-only permissions, no token in its environment or git config, and it can
# only hand back an artifact. The jobs that can deploy and comment never run
# PR code; they only copy files. Only PRs from branches in this repo are built
# (people with write access); PRs from forks are skipped entirely.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:

permissions: {}

# Each run builds everything, so a queued run supersedes an older queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  list:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,headRefOid,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not) | {number, sha: .headRefOid}]' | jq -c .)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "$prs"

  build-main:
    needs: list
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-main
          path: dist
          retention-days: 1

  # Runs PR code. Keep this job without permissions, secrets or tokens.
  build-pr:
    needs: list
    if: needs.list.outputs.prs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list.outputs.prs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.pr.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: /msa-website/pr/${{ matrix.pr.number }}
      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.pr.number }}-${{ matrix.pr.sha }}
          path: dist
          retention-days: 1

  # Never runs PR code: only downloads build output and moves it into place.
  deploy:
    needs: [list, build-main, build-pr]
    if: always() && needs.build-main.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      pull-requests: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_URL: https://bartbrinkman.github.io/msa-website
      PRS: ${{ needs.list.outputs.prs }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-main
          path: site

      # Missing previews (no open PRs, or failed builds) are handled below.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: preview-*
          path: previews

      # Writes "number sha ok|failed" per PR for the comment step. An artifact
      # is only used if its name matches a PR and commit from the list above.
      - name: Put each preview under /pr/<number>/
        run: |
          : > previews.txt
          echo "$PRS" | jq -r '.[] | "\(.number) \(.sha)"' > prs.txt
          while read -r n sha; do
            src="previews/preview-$n-$sha"
            if [ -d "$src" ]; then
              mkdir -p "site/pr/$n"
              cp -r "$src/." "site/pr/$n/"
              echo "$n $sha ok" >> previews.txt
            else
              echo "::warning::No preview for PR #$n ($sha); its build failed"
              echo "$n $sha failed" >> previews.txt
            fi
          done < prs.txt
          cat previews.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      # One comment per PR per commit: the marker carries the commit, so a PR
      # that was rebuilt without changes is not commented on again.
      - name: Comment the preview link on each updated pull request
        run: |
          while read -r n sha status; do
            marker="<!-- msa-preview:$sha -->"
            seen=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" < /dev/null)
            [ -n "$seen" ] && continue
            url="$PAGES_URL/pr/$n/"
            if [ "$status" = ok ]; then
              body="$marker
          **Preview bijgewerkt** voor commit \`${sha:0:7}\`: $url

          Zo ziet de site eruit met deze wijziging. De echte website verandert pas als deze pull request is samengevoegd."
            else
              body="$marker
          **Preview kon niet worden gebouwd** voor commit \`${sha:0:7}\`. Zie de Check bij deze pull request voor de foutmelding."
            fi
            gh pr comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body" < /dev/null
          done < previews.txt
